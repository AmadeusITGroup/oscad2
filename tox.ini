[tox]
envlist = py312, py313, py314, flake8, coverage
requires = tox>=4

[testenv]
extras = test
commands = pytest {posargs}

[testenv:coverage]
extras = test
deps = coverage
commands =
    coverage run -m pytest
    coverage report

[testenv:flake8]
skip_install = true
deps = flake8
commands = flake8 oscad oscad_data oscad_i18n oscad_theme_basic oscad_theme_amadeus tests
