###
# app configuration
# http://docs.pylonsproject.org/projects/pyramid/en/latest/narr/environment.html
###

[app:main]
use = egg:oscad

pyramid.reload_templates = false
pyramid.debug_authorization = false
pyramid.debug_notfound = false
pyramid.debug_routematch = false

pyramid.default_locale_name = en
available_locales = en de fr
; Serve Bootstrap's JavaScript from a CDN instead of the bundled copy:
; bootstrap_location = https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/
themes = oscad_theme_basic
; The session secret must be provided through the OSCAD_SESSION_SECRET
; environment variable (or `session.secret`, if the file is kept private).

###
# wsgi server configuration
###

[server:main]
use = egg:waitress#main
host = 127.0.0.1
port = 6543
url_prefix = /oscad

###
# logging configuration
# http://docs.pylonsproject.org/projects/pyramid/en/latest/narr/logging.html
###

[loggers]
keys = root, oscad

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_oscad]
level = WARN
handlers =
qualname = oscad

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s][%(threadName)s] %(message)s
